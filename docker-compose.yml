services:
  mongo:
    image: mongo:7
    container_name: immex-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: immex-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/immex
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ./frontend
    container_name: immex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4201:80"

volumes:
  mongo_data:
